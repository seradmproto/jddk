<script>
  document.addEventListener('DOMContentLoaded', function () {
    const status = document.getElementById('statusMessage');
    let reloadStarted = false;

    function startCountdown() {
      if (reloadStarted) return;
      reloadStarted = true;

      let secondsLeft = 5;
      if (status) {
        status.textContent = 'That password is incorrect.. Refreshing page in ' + secondsLeft + ' seconds...';
      }

      const timer = setInterval(function () {
        secondsLeft--;
        if (status && secondsLeft > 0) {
          status.textContent = 'That password is incorrect.. Refreshing page in ' + secondsLeft + ' seconds...';
        }
        
        if (secondsLeft <= 0) {
          clearInterval(timer);
          if (status) {
            status.textContent = 'Refreshing now...';
          }

          window.location.reload();
        }
      }, 1000);
    }

    const observer = new MutationObserver(function () {
      const popup = document.getElementById('ratufa_popup');
      if (popup && popup.style.visibility === 'visible' && !popup.querySelector('.ratufa-spinner')) {
        observer.disconnect();
        startCountdown();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style']
    });
  });
</script>
